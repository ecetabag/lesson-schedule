</style></head><body><header><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M3 11c4-4 7-4 11 0s7 4 11 0M3 17c4-4 7-4 11 0s7 4 11 0" stroke="#304b52" stroke-width="1.8" stroke-linecap="round"/></svg>Waterpolo Lessons</header><main><div class="center"><h1>Lesson scheduling</h1><p>Choose an option to continue.</p><button class="choice" onclick="go('booking')"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M12 13v6M9 16h6"/></svg></span><span class="info"><span class="name">New lesson</span><span class="sub">Choose a date and time</span></span><span class="arrow">→</span></button><button class="choice" onclick="go('manage')"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15h8M14 12l3 3-3 3"/></svg></span><span class="info"><span class="name">Manage lesson booking</span><span class="sub">Change an existing reservation</span></span><span class="arrow">→</span></button><div id="notice" role="status">Booking service setup is pending. The site owner needs to deploy Google Apps Script and set its URL in this website.</div></div></main><footer>Waterpolo Lessons · Scheduling</footer><script src="config.js"></script><script>function go(view){const base=(window.WATERPOLO_APP_SCRIPT_URL||'').trim();if(!/^https:\/\/script\.google\.com\/macros\/s\//.test(base)){document.getElementById('notice').style.display='block';return;}const url=new URL(base);url.searchParams.set('view',view);window.location.assign(url.toString());}</script></body></html>
